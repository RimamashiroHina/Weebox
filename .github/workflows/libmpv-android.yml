name: libmpv Android (LGPL)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android-libmpv/**
      - .github/workflows/libmpv-android.yml

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: armv7l
            abi: armeabi-v7a
          - arch: x86_64
            abi: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm wget xz-utils
          sudo pip3 install --break-system-packages meson

      - name: Build
        run: bash android-libmpv/build.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-android-lgpl-${{ matrix.abi }}
          path: |
            android-libmpv/out/lib/
            android-libmpv/out/MANIFEST.txt
            android-libmpv/out/lgpl.patch
            android-libmpv/out/build.sh

      # The same sources serve every architecture.
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: libmpv-android-lgpl-source
          path: android-libmpv/out/source.tar.xz
